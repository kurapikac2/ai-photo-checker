<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fake Image Checker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="mx-auto max-w-6xl px-4 py-6">
        <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <a href="{% url 'detector:home' %}" class="text-2xl font-bold tracking-tight">Fake Image Checker</a>
            <nav class="flex gap-3 text-sm text-slate-300">
                <a href="{% url 'detector:home' %}" class="rounded-full border border-slate-700 px-4 py-2 hover:border-sky-500 hover:text-white">Проверка</a>
                <a href="{% url 'detector:history' %}" class="rounded-full border border-slate-700 px-4 py-2 hover:border-sky-500 hover:text-white">История</a>
                <a href="/admin/" class="rounded-full border border-slate-700 px-4 py-2 hover:border-sky-500 hover:text-white">Админка</a>
            </nav>
        </header>
        {% if messages %}
            <div class="mb-6 space-y-3">
                {% for message in messages %}
                    <div class="rounded-2xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-sm text-rose-100">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>

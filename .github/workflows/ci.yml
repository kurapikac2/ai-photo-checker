name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Public, non-secret test-only key. Never use this value in production.
      DJANGO_SECRET_KEY: ci-only-development-test-key-not-for-production-1234
      DEBUG: "False"
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Scoring and upload validation tests
        run: python manage.py test tests --verbosity 2

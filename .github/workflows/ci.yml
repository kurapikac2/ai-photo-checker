name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # Public, non-secret test-only key. Never use this value in production.
      DJANGO_SECRET_KEY: ci-only-development-test-key-not-for-production-1234
      DEBUG: "False"
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Dependency advisories
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Scoring and upload validation tests
        run: python manage.py test tests --verbosity 2

      - name: Set up Node for browser regression
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify real browser upload and privacy
        if: matrix.python-version == '3.12'
        env:
          OPENROUTER_API_KEY: ''
        run: |
          npm ci --prefix e2e
          cd e2e && npx playwright install --with-deps chromium && cd ..
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8014 --noreload > /tmp/photo-checker.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8014/ > /dev/null; then break; fi
            sleep 1
          done
          npm test --prefix e2e

      - name: Upload actual browser evidence
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: photo-checker-browser-evidence
          path: test-results/
          if-no-files-found: error
